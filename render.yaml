# Apply this blueprint only if it matches the existing web service deployment.
services:
  - type: cron
    name: pestfree-northland-daily-backup
    runtime: python
    schedule: "0 2 * * *"
    buildCommand: pip install -r requirements.txt
    startCommand: curl --fail --retry 3 --retry-delay 5 --request POST --header "X-Backup-Cron-Key: ${BACKUP_CRON_TOKEN}" "${BACKUP_BASE_URL}/backups/create"
    envVars:
      - key: BACKUP_BASE_URL
        sync: false
      - key: BACKUP_CRON_TOKEN
        sync: false
